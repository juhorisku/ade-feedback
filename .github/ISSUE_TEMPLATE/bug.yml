name: Something went wrong
description: ADE did something it should not have, or did not do something it should have.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to tell us.

        **Before you write:** this page is public. Anyone can read what you put here, and a picture you attach is published the moment you submit. Please leave out anything secret (passwords, keys, private code) and anything about other people (their names, their email, their screens).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: In your own words. What did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: The steps that lead to it, one per line, from the start if you can.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: false
  - type: dropdown
    id: how-often
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Only once so far
        - Not sure
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: A picture of the screen (optional)
      description: If a picture helps, drag it into this box or paste it here. Check first that it shows nothing secret and nobody else's details.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: ADE's version
      description: Filled in for you when you start from ADE's window. Leave it as it is.
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: The window's build
      description: Filled in for you when you start from ADE's window. Leave it as it is.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Windows version
      description: Filled in for you when you start from ADE's window. Leave it as it is.
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Before you submit
      options:
        - label: I understand that this page is public, and that what I write and any picture I attach are published when I submit.
          required: true
