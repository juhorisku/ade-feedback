name: Something about the window
description: Something in ADE's window is unclear, awkward, or could look or work better.
title: "[UI] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to tell us.

        **Before you write:** this page is public. Anyone can read what you put here, and a picture you attach is published the moment you submit. Please leave out anything secret (passwords, keys, private code) and anything about other people (their names, their email, their screens).
  - type: input
    id: area
    attributes:
      label: Where in the window?
      description: The page, panel or button you mean, in your own words.
      placeholder: For example, the Projects page, the search box at the top
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: What would you like to tell us?
      description: What was unclear or awkward, and what would have helped.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: A picture of the screen
      description: A picture helps a lot here. Drag it into this box or paste it here. Check first that it shows nothing secret and nobody else's details.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: ADE's version
      description: Filled in for you when you start from ADE's window. Leave it as it is.
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: The window's build
      description: Filled in for you when you start from ADE's window. Leave it as it is.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Windows version
      description: Filled in for you when you start from ADE's window. Leave it as it is.
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Before you submit
      options:
        - label: I understand that this page is public, and that what I write and any picture I attach are published when I submit.
          required: true
